name: Publish website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and Skill install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Check JavaScript syntax
        run: |
          node --check showcase/src/app.js
          node --check showcase/src/landing.js
          node --check showcase/src/projects.js
          node --check scripts/check-repo.mjs
      - name: Check repository structure and references
        run: node scripts/check-repo.mjs
      - name: Install Skill in a temporary project
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          temp_project="$(mktemp -d)"
          trap 'rm -rf "$temp_project"' EXIT
          cd "$temp_project"
          printf '{"name":"vibecoding-workflow-smoke","private":true}\n' > package.json
          npx --yes skills add "$GITHUB_WORKSPACE" --skill vibecoding-workflow --agent codex --copy --yes
          test -f "$temp_project/.agents/skills/vibecoding-workflow/SKILL.md"

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: showcase
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
